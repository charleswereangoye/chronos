version: '3.8'

services:
  chronos_bot:
    image: localhost/chronos_chronos_bot:latest
    container_name: chronos_telegram_bot
    restart: unless-stopped
    command: ["./entrypoint.sh"]
    env_file:
      - .env
    volumes:
      # Live development mounts
      - ./agents:/app/agents
      - ./shared:/app/shared
      - ./orchestrator:/app/orchestrator
      - ./assets:/app/assets
      - ./entrypoint.sh:/app/entrypoint.sh
      # Mount timezone files to sync container time with host laptop time
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
