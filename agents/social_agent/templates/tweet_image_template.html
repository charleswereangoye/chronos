<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body class="w-[1080px] h-[1350px] flex items-center justify-center p-12">

  <div id="tweet-card" class="w-full max-w-[900px] flex flex-col justify-center space-y-6">
    
    <div class="flex items-center space-y-0 space-x-6">
      <img src="profile.png" class="w-24 h-24 rounded-full object-cover" alt="Profile">
      <div>
        <div class="flex items-center space-x-3">
          <span class="font-bold text-[35px] text-white">Chalee Black Trades</span>
          <svg class="w-[28px] h-[28px] text-[#1d9bf0]" fill="currentColor" viewBox="0 0 24 24">
            <path d="M22.5 12.5c0-1.58-.875-2.95-2.148-3.6.154-.435.238-.905.238-1.4 0-2.21-1.79-4-4-4-.495 0-.965.084-1.4.238C14.55 2.475 13.18 1.6 11.6 1.6c-1.58 0-2.95.875-3.6 2.148-.435-.154-.905-.238-1.4-.238-2.21 0-4 1.79-4 4 0 .495.084.965.238 1.4C1.475 9.55.6 10.92.6 12.5c0 1.58.875 2.95 2.148 3.6-.154.435-.238.905-.238 1.4 0 2.21 1.79 4 4 4 .495 0 .965-.084 1.4-.238 1.05 1.273 2.42 2.148 4 2.148 1.58 0 2.95-.875 3.6-2.148.435.154.905.238 1.4.238 2.21 0 4-1.79 4-4 0-.495-.084-.965-.238-1.4 1.273-1.05 2.148-2.42 2.148-4zM9.9 17.15l-4.25-4.25 1.41-1.41L9.9 14.33l7.09-7.09 1.41 1.41L9.9 17.15z"/>
          </svg>
        </div>
        <span class="text-gray-500 text-[28px]">@chaleeblack</span>
      </div>
    </div>

    <div class="text-[40px] font-medium leading-snug tracking-wide text-white">
      {{ quote }}
    </div>

    <div class="w-full flex justify-center py-4">
      <img src="{{ image_src }}" class="max-h-[600px] w-auto object-contain rounded-2xl border border-gray-800" alt="Post Image">
    </div>

    <div class="text-gray-500 text-[28px] pt-2">
      <span>{{ timestamp }}</span>
    </div>

  </div>

</body>
</html>
